# 本机打包：bun run docker:pack → dist/vome-service.tar
# （混淆 index.js + linux-x64 sharp；运行时 oven/bun）
# Linux：docker load -i dist/vome-service.tar && docker compose up -d
networks:
  1panel-network:
    external: true

services:
  service:
    image: vome-service:latest
    container_name: vome-service
    restart: unless-stopped
    networks:
      - 1panel-network
    ports:
      - "3000:3000"
    volumes:
      - ./.vome:/app/.vome
      - ./logging:/app/logging
